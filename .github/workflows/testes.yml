name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend (node --test)
        run: npm test -w backend
      - name: Frontend (Vitest)
        run: npm test -w frontend
      - name: Build do frontend
        run: npm run build
